<div class="login-container">
  <form (ngSubmit)="onLogin()" #loginForm="ngForm">
    <h2>Bejelentkezés</h2>

    <label for="username">Felhasználónév</label>
    <input
      type="text"
      id="username"
      name="username"
      required
      [(ngModel)]="username"
    />
    <label for="password">Jelszó</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      [(ngModel)]="password"
    />
    <button type="submit">Belépés</button>
    <button type="button" (click)="onClickRegister()">Nincs még fiókod?</button>
  </form>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
